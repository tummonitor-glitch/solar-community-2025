name: Vachana Thai TTS Sample

on:
  push:
    paths:
      - '.github/workflows/vachana_tts_sample.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vachanatts
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Thai male sample
        run: |
          mkdir -p generated
          python - <<'PY'
          from vachanatts import TTS
          text = 'ประเด็นสำคัญ ไม่ใช่การเชื่อคำกล่าวของฝ่ายใด แต่คือการพิจารณาเอกสาร เส้นทางเงิน ลำดับเหตุการณ์ และพยานหลักฐาน ว่าสอดคล้องกันเพียงใด'
          TTS(text, voice='th_m_1', output='generated/vachana_th_m_1.wav', volume=1.0, speed=0.92)
          TTS(text, voice='th_m_2', output='generated/vachana_th_m_2.wav', volume=1.0, speed=0.92)
          PY
          ffmpeg -y -i generated/vachana_th_m_1.wav -af 'highpass=f=70,lowpass=f=15000,loudnorm=I=-16:LRA=7:TP=-1.5' -c:a libmp3lame -b:a 128k generated/vachana_th_m_1.mp3
          ffmpeg -y -i generated/vachana_th_m_2.wav -af 'highpass=f=70,lowpass=f=15000,loudnorm=I=-16:LRA=7:TP=-1.5' -c:a libmp3lame -b:a 128k generated/vachana_th_m_2.mp3

      - name: Commit generated samples
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/vachana_th_m_1.mp3 generated/vachana_th_m_2.mp3
          git commit -m 'Generate Thai TTS samples' || exit 0
          git push
